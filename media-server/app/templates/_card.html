<div class="card{% if not m.enabled %} disabled{% endif %}" id="card-{{ m.id }}" data-id="{{ m.id }}" data-state="{{ card_state(m) }}">
  <a href="/media/{{ m.id }}">
    {% if m.thumb_path %}<img loading="lazy" src="{{ media_url(m.id, 'thumb') }}" alt="">{% else %}<div class="noimg">{{ m.status }}…</div>{% endif %}
  </a>
  {% if m.kind == 'video' %}<span class="badge">▶ {{ '%d:%02d' % ((m.duration or 0) // 60, (m.duration or 0) % 60) }}</span>{% endif %}
  <button class="secondary toggle" hx-post="/media/{{ m.id }}/toggle" hx-target="#card-{{ m.id }}" hx-swap="outerHTML"
          title="{{ 'Disable (never send)' if m.enabled else 'Enable' }}">{{ '✓' if m.enabled else '⊘' }}</button>
  <div class="meta">
    <span class="pill {{ m.status }}">{{ m.status }}</span>{% if m.rating %} <span class="pill">{{ m.rating }}</span>{% endif %}
    <div class="cap">{{ m.caption or m.error or '' }}</div>
  </div>
</div>
